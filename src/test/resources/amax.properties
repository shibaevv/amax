db.driverClassName=org.h2.Driver
db.databasePlatform=org.hibernate.dialect.H2Dialect
db.path=${DB_PATH:${java.io.tmpdir}/db}
db.name=${DB_NAME:amaxdb}
db.url=jdbc:h2:mem:${db.name};DB_CLOSE_DELAY=-1;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;
#db.url=jdbc:h2:file:${db.path}/${db.name};MODE=MYSQL;DATABASE_TO_LOWER=TRUE;
db.username=sa
db.password=
#
# none,validate,update,create,create-drop
hibernate.hbm2ddl.auto=none
